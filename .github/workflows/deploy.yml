name: Deploy Team Agents

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-agents-production
  cancel-in-progress: false

env:
  D1_DATABASE_NAME: team-agents-db
  AGENT_QUEUE_NAME: team-agents-agent-tasks
  AGENT_DLQ_NAME: team-agents-agent-tasks-dlq
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://team-agents.netmind-ai.workers.dev' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and Worker bundle
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          AUTH_HMAC_KEY: ${{ secrets.AUTH_HMAC_KEY }}
        run: |
          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CREDENTIALS_ENCRYPTION_KEY \
            AUTH_HMAC_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "${#CREDENTIALS_ENCRYPTION_KEY}" -lt 32 ]; then
            echo "::error::CREDENTIALS_ENCRYPTION_KEY must be at least 32 characters"
            exit 1
          fi
          if [ "${#AUTH_HMAC_KEY}" -lt 32 ]; then
            echo "::error::AUTH_HMAC_KEY must be at least 32 characters"
            exit 1
          fi

      - name: Ensure queues exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          ensure_queue() {
            queue_name="$1"
            if ! npx wrangler queues list --config wrangler.toml \
              | grep -Eq "(^|[^[:alnum:]_-])${queue_name}([^[:alnum:]_-]|$)"
            then
              npx wrangler queues create "$queue_name" --config wrangler.toml
            fi
          }
          ensure_queue "$AGENT_DLQ_NAME"
          ensure_queue "$AGENT_QUEUE_NAME"

      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          database_id="$(
            npx wrangler d1 list --json \
              | jq -r --arg name "$D1_DATABASE_NAME" \
                'map(select(.name == $name)) | first | .uuid // empty'
          )"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create "$D1_DATABASE_NAME" \
              --location weur \
              --config wrangler.toml
            database_id="$(
              npx wrangler d1 list --json \
                | jq -r --arg name "$D1_DATABASE_NAME" \
                  'map(select(.name == $name)) | first | .uuid // empty'
            )"
          fi
          if [ -z "$database_id" ]; then
            echo "::error::Could not resolve D1 database ${D1_DATABASE_NAME}"
            exit 1
          fi
          node scripts/set-d1-database-id.mjs wrangler.toml "$database_id"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Build production Worker
        run: npm run build

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.toml

      - name: Deploy Worker and encrypted secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          secrets: |
            CREDENTIALS_ENCRYPTION_KEY
            AUTH_HMAC_KEY
        env:
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          AUTH_HMAC_KEY: ${{ secrets.AUTH_HMAC_KEY }}

      - name: Smoke test production
        run: npm run smoke -- "$PRODUCTION_URL"
